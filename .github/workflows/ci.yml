name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; no job needs a token with write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Known vulnerabilities in runtime dependencies (they end up in the deployed bundle).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The deployed artifact is the image, so a broken Dockerfile must fail CI before Render sees it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t evidence-skoleni .
